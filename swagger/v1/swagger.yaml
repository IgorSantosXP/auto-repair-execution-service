---
openapi: 3.0.1
info:
  title: Execution Service
  version: v1
  description: Fila de execução das ordens de serviço e catálogo de peças/estoque
    (DynamoDB)
paths:
  "/api/v1/executions":
    get:
      summary: Lists the execution queue
      tags:
      - Executions
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        description: queued, in_diagnosis, in_repair or finished
        schema:
          type: string
      responses:
        '200':
          description: filtered by status
        '422':
          description: unknown status
        '401':
          description: unauthorized
  "/api/v1/executions/{service_order_uuid}":
    parameters:
    - name: service_order_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Shows an execution
      tags:
      - Executions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: execution returned
        '404':
          description: execution not found
  "/api/v1/executions/{service_order_uuid}/start_diagnosis":
    parameters:
    - name: service_order_uuid
      in: path
      required: true
      schema:
        type: string
    - name: body
      in: body
      required: false
      schema:
        type: object
        properties:
          notes:
            type: string
    post:
      summary: Moves the execution from queued to in_diagnosis
      tags:
      - Executions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: transition applied
        '422':
          description: invalid transition
        '404':
          description: execution not found
  "/api/v1/executions/{service_order_uuid}/start_repair":
    parameters:
    - name: service_order_uuid
      in: path
      required: true
      schema:
        type: string
    - name: body
      in: body
      required: false
      schema:
        type: object
        properties:
          notes:
            type: string
    post:
      summary: Moves the execution from in_diagnosis to in_repair
      tags:
      - Executions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: transition applied
        '422':
          description: invalid transition
        '404':
          description: execution not found
  "/api/v1/executions/{service_order_uuid}/finish":
    parameters:
    - name: service_order_uuid
      in: path
      required: true
      schema:
        type: string
    - name: body
      in: body
      required: false
      schema:
        type: object
        properties:
          notes:
            type: string
    post:
      summary: Moves the execution from in_repair to finished
      tags:
      - Executions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: transition applied
        '422':
          description: invalid transition
        '404':
          description: execution not found
  "/api/v1/parts":
    get:
      summary: Lists parts
      tags:
      - Parts
      security:
      - bearerAuth: []
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: name
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: filtered by active and name
        '401':
          description: missing or invalid token
    post:
      summary: Creates a part
      tags:
      - Parts
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: part created
        '422':
          description: duplicate sku
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: oleo-5w30
                  description: Opcional; gerado (uuid) quando omitido
                sku:
                  type: string
                  example: OLEO-5W30
                name:
                  type: string
                  example: Óleo 5W30 1L
                description:
                  type: string
                unit_price_cents:
                  type: integer
                  example: 4500
                stock_quantity:
                  type: integer
                  example: 50
                  description: Gera uma movimentação inbound inicial
              required:
              - sku
              - name
              - unit_price_cents
  "/api/v1/parts/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Shows a part
      tags:
      - Parts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: part returned
        '404':
          description: part not found
    patch:
      summary: Updates a part
      tags:
      - Parts
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: part updated
        '422':
          description: invalid attributes
        '404':
          description: part not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                name:
                  type: string
                description:
                  type: string
                unit_price_cents:
                  type: integer
                active:
                  type: boolean
    delete:
      summary: Deactivates a part (soft delete)
      tags:
      - Parts
      security:
      - bearerAuth: []
      responses:
        '204':
          description: part deactivated
        '404':
          description: part not found
  "/api/v1/parts/{part_id}/stock_movements":
    parameters:
    - name: part_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Lists the stock movements of a part (latest first)
      tags:
      - Stock
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: movements returned
        '404':
          description: part not found
    post:
      summary: Registers a stock movement
      tags:
      - Stock
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: outbound registered
        '422':
          description: invalid quantity
        '404':
          description: part not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                movement_type:
                  type: string
                  enum:
                  - inbound
                  - outbound
                  - adjustment_in
                  - adjustment_out
                quantity:
                  type: integer
                  example: 5
                reason:
                  type: string
              required:
              - movement_type
              - quantity
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
servers:
- url: "/"
  description: Current host
