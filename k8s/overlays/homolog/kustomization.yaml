apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-execution-homolog

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: execution-config
    literals:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - DD_ENV=homolog
      - DD_SERVICE=execution-service
      - SERVICE_NAME=execution-service
      - AWS_REGION=us-east-1
      - DYNAMODB_TABLE_PREFIX=auto-repair-homolog-execution
      - EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:814623398856:auto-repair-homolog-events
      - QUEUE_URL=https://sqs.us-east-1.amazonaws.com/814623398856/auto-repair-homolog-execution

images:
  - name: auto-repair-execution-service
    newName: 814623398856.dkr.ecr.us-east-1.amazonaws.com/auto-repair-execution-service
    newTag: latest
